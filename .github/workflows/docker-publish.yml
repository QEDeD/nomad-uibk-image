# Build and publish a Docker image.
name: Build and publish docker images

on:
  push:
    branches: ["main", "develop"]
    # Publish semver tags as releases.
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "develop"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      plugins_to_skip:
        description: "Comma-separated plugin distribution or exact module names"
        required: false
        type: string
        default: "nomad-pvcomb"

env:
  REGISTRY: ghcr.io
  UV_VERSION: 0.9
  PYTHON_VERSION: 3.12
  JUPYTER_VERSION: "2025-04-14"
  # If you want to include custom documentation, create a fork of the repo below and link the forked repo here
  NOMAD_DOCS_REPO: https://github.com/FAIRmat-NFDI/nomad-docs.git
  NOMAD_DOCS_REPO_REF: ""
  # Comma-separated distribution names are canonical. Whitespace separators remain
  # accepted for compatibility. The same list applies to unit and example-upload tests.
  PLUGIN_TESTS_PLUGINS_TO_SKIP: ${{ inputs.plugins_to_skip || 'nomad-pvcomb' }}

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  # Job 1: Update Lock File
  update-lockfile:
    name: Update Python Lock File
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Update lock file
        run: uv lock

      # Commits any changes made to the lockfile
      - name: Commit lock file changes
        if: github.ref_type != 'tag'
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          git add uv.lock
          if [[ `git status --porcelain` ]]; then
            git commit -m "Update lockfile"
            git push origin -o ci.skip # prevent triggering the pipeline again
          fi

  # Job 2: Run unit tests for all of the plugin
  plugin_unit_tests:
    name: Run plugin unit tests
    needs: update-lockfile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    env:
      PLUGIN_TESTS_CI_NODE_TOTAL: 2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run plugin tests
        env:
          PLUGIN_TESTS_CI_NODE_INDEX: ${{ matrix.group }}
        run: |
          uv run \
            --frozen \
            --extra plugins \
            --group test \
            nomad-plugin-tests \
            --plugins-to-skip "$PLUGIN_TESTS_PLUGINS_TO_SKIP"

  # Job 3: Build and Push Docker Image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: update-lockfile

    strategy:
      fail-fast: false
      matrix:
        service:
          - app
          - jupyter
          - cpu-action
          # - gpu-action
        include:
          - service: app
            target: final
            image_suffix: ""
          - service: jupyter
            target: jupyter
            image_suffix: /jupyter
          # - service: gpu-action
          #   target: gpu_action_final
          #   image_suffix: /gpu-action
          - service: cpu-action
            target: cpu_action_final
            image_suffix: /cpu-action

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          submodules: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        if: github.event_name != 'workflow_dispatch'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.image_suffix }}

      - name: Set deterministic metadata for manual verification
        id: manual_meta
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_SUFFIX: ${{ matrix.image_suffix }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "tags=${REGISTRY}/${repository}${IMAGE_SUFFIX}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            UV_VERSION=${{ env.UV_VERSION }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            NOMAD_DOCS_REPO=${{ env.NOMAD_DOCS_REPO }}
            NOMAD_DOCS_REPO_REF=${{ env.NOMAD_DOCS_REPO_REF }}
            JUPYTER_VERSION=${{ env.JUPYTER_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.manual_meta.outputs.tags || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set image output
        run: |
          FIRST_TAG=$(echo "${{ steps.manual_meta.outputs.tags || steps.meta.outputs.tags }}" | head -n1)
          echo "${{ matrix.service }}_IMAGE=$FIRST_TAG" >> $GITHUB_ENV

    outputs:
      app_image: ${{ env.app_IMAGE }}
      jupyter_image: ${{ env.jupyter_IMAGE }}

  # Job 4: Run example upload tests and entrypoint tests
  run_tests:
    name: Run example upload tests and entrypoint tests
    needs: build
    runs-on: ubuntu-latest
    env:
      APP_IMAGE: ${{ needs.build.outputs.app_image }}
      JUPYTER_IMAGE: ${{ needs.build.outputs.jupyter_image }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          submodules: true

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start containers and check app/jupyter container health
        working-directory: tests
        run: |
          if ! docker compose up -d --quiet-pull --wait; then
            echo "Containers failed health check."
            docker compose ps
            docker compose logs --no-color app jupyter
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --extra plugins --group test

      - name: Run tests
        working-directory: tests
        run: uv run --frozen --extra plugins --group test pytest -p no:warnings -sv
