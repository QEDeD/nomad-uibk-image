[build-system]
requires = ["setuptools>=82.0.1", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
name = "nomad-distribution"
description = "nomad distribution template"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "nomad-lab[parsing, infrastructure]>=1.4.3",
  "plotly<6.0",
]

[project.urls]
repository = "https://github.com/Thin-Layers-Technology-Innsbruck/nomad-uibk-image"

[project.optional-dependencies]
plugins = [
  "nomad-measurements>=1.3.4",
  "nomad-schema-plugin-run>=1.0.1",
  "nomad-uibk-plugin @ git+https://github.com/Thin-Layers-Technology-Innsbruck/nomad-UIBK-plugin.git@c895fe6f2bb38a531fca3ddcbef284fa5bc7dfc3",
  "pynxtools==0.12.0",
  "pynxtools-apm>=0.4.2",
  "nomad-pvcomb @ git+https://github.com/QEDeD/nomad-pvcomb.git@e1b28bd7ea6e94705031d2884b2a3e056ebc2232",
  "nomad-north-voila @ git+https://github.com/FAIRmat-NFDI/nomad-north-voila.git@main",
  "nomad-north-jupyter>=0.2.6",
]
jupyter = [
  "voila",
  "jupyterhub<5.0.0",
  "jupyterlab_server>=2.27.1,<3",
  "jupyter-events",
  # Reinstall this locked wheel in the layered Conda image so its Python and
  # compiled backend cannot come from different preinstalled versions.
  "pyzmq==27.1.0",
  "ipyaggrid",
  "ipydatagrid",
  "ipysheet",
  "pyvis",
  "ipympl",
  "ipyvuetify",
]

gpu-action = []
cpu-action = [
  "nomad-uibk-plugin[cpu-action] @ git+https://github.com/Thin-Layers-Technology-Innsbruck/nomad-UIBK-plugin.git@c895fe6f2bb38a531fca3ddcbef284fa5bc7dfc3",
]

dev = ["nomad-lab[parsing, infrastructure, dev]>=1.4.3"]

[dependency-groups]
test = [
  # Fork release candidate. Replace with nomad-plugin-tests==0.3.0 after the
  # upstream package release is published.
  "nomad-plugin-tests @ git+https://github.com/QEDeD/nomad-plugin-tests.git@6619c2ce509988e302d4d1fab0fcebe20e4e1487",
  "pytest>=8.3.5,<10",
  "pyyaml>=6.0",
  "ruff>=0.15,<0.16",
]

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]

# nomad-uibk-plugin currently declares the upstream PVComb Git URL. Use the
# independently verified candidate for every occurrence in this distribution.
override-dependencies = [
  "nomad-pvcomb @ git+https://github.com/QEDeD/nomad-pvcomb.git@e1b28bd7ea6e94705031d2884b2a3e056ebc2232",
]

required-version = ">=0.8.0"
prerelease = "if-necessary-or-explicit"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
exclude = ["gui*", "docs*", "config*"]

[tool.setuptools_scm]
fallback_version = "0.0"
